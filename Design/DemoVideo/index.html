<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Kinara — Demo film</title>
<script type="importmap">
  { "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
</script>
<style>
  :root {
    --ink: #f5f5f7;
    --muted: #8d8f96;
    --faint: #5d5f66;
    --line: rgba(255, 255, 255, 0.09);
    --glass: rgba(34, 35, 39, 0.72);
    --light: #eef3ff;
    --accent: 10, 132, 255;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
    --rounded: "SF Pro Rounded", ui-rounded, -apple-system, sans-serif;
    --mono: "SF Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #000; overflow: hidden; }
  body.scrub { display: grid; place-items: center; height: 100vh; }
  #stage {
    position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #030304;
    font-family: var(--font); color: var(--ink); -webkit-font-smoothing: antialiased; font-feature-settings: "ss01";
    transform-origin: 50% 50%;
  }
  .layer, .scene { position: absolute; inset: 0; }
  #bg { background: radial-gradient(1200px 800px at 50% 46%, rgba(40, 42, 50, 0.5), transparent 70%), #030304; }
  #gl { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  #vignette { background: radial-gradient(140% 120% at 50% 45%, transparent 55%, rgba(0, 0, 0, 0.5) 100%); pointer-events: none; }
  #shade { background: #000; pointer-events: none; }
  .scene { perspective: 2000px; }

  /* The screen: its DOM is laid onto the 3D slab by a matrix3d every frame. */
  #display { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #display .bezel { position: absolute; left: 0; top: 0; border-radius: 30px; background: #050506; box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.05); overflow: hidden; }
  #display .screen { position: absolute; overflow: hidden; background: #0b1024; color: #fff; }
  #display .abs { position: absolute; }

  .words { white-space: nowrap; }
  .words .w { display: inline-block; will-change: transform, opacity, filter; }
  .mega { font-size: 300px; line-height: 0.95; font-weight: 700; letter-spacing: -0.055em; }
  .h0 { font-size: 150px; line-height: 1; font-weight: 680; letter-spacing: -0.045em; }
  .h1 { font-size: 112px; line-height: 1.04; font-weight: 660; letter-spacing: -0.04em; }
  .h2 { font-size: 76px; line-height: 1.06; font-weight: 640; letter-spacing: -0.032em; }
  .h3 { font-size: 52px; line-height: 1.1; font-weight: 620; letter-spacing: -0.026em; }
  .sub { font-size: 34px; line-height: 1.3; font-weight: 500; letter-spacing: -0.012em; color: var(--muted); }
  .small { font-size: 24px; line-height: 1.35; font-weight: 500; color: var(--muted); letter-spacing: -0.005em; }
  .eyebrow { font-size: 19px; font-weight: 650; letter-spacing: 0.22em; text-transform: uppercase; color: var(--faint); }
  .grad .w { background: linear-gradient(180deg, #ffffff 0%, #eceef2 45%, #a9adb6 100%); -webkit-background-clip: text; background-clip: text; color: transparent; padding: 0 0.02em 0.08em; }
  .center { text-align: center; }
  .shadowed { text-shadow: 0 2px 30px rgba(0, 0, 0, 0.75), 0 0 80px rgba(0, 0, 0, 0.5); }

  .glyph { display: inline-grid; place-items: center; flex: none; }
  .glyph svg { display: block; }

  .glass {
    background: linear-gradient(180deg, rgba(48, 49, 54, 0.78), rgba(28, 29, 32, 0.78));
    border: 1px solid rgba(255, 255, 255, 0.10); border-radius: 34px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 40px 80px rgba(0, 0, 0, 0.45), 0 8px 24px rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(30px) saturate(1.2);
  }
  .pill { display: inline-flex; align-items: center; gap: 14px; padding: 16px 26px 16px 20px; border-radius: 999px; font-size: 30px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; }
  .pill.light { background: #f5f5f7; color: #111; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45); }
  .pill.dark { background: rgba(30, 31, 35, 0.92); border: 1px solid var(--line); color: var(--ink); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45); }

  #scrubber { position: fixed; left: 24px; right: 24px; bottom: 16px; display: flex; gap: 12px; align-items: center; color: #aaa; font: 13px var(--mono); }
  #scrubber input { flex: 1; }
</style>
</head>
<body>
  <div id="stage">
    <div id="bg" class="layer"></div>
    <canvas id="gl" width="1920" height="1080"></canvas>
    <div id="set" class="layer"><div id="display"></div></div>
    <div id="dom" class="layer"></div>
    <div id="vignette" class="layer"></div>
    <div id="shade" class="layer"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
